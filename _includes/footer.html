<footer class="site-footer">
  <div class="container footer-top">
    <div class="footer-address">
      <p><strong>Ishaque Lab</strong><br>
      BIH Center of Digital Health<br>
      Charité - Universitätsmedizin Berlin<br>
      Luisenstraße 65, 10115 Berlin, Germany</p>
    </div>
    <ul class="footer-social" aria-label="Lab profiles">
      <li><a href="mailto:{{ site.email }}" title="Email"><img src="{{ '/assets/img/mail.svg' | relative_url }}" alt="Email"></a></li>
      <li><a href="{{ site.github_org }}" title="GitHub"><img src="{{ '/assets/img/github.svg' | relative_url }}" alt="GitHub"></a></li>
      <li><a href="{{ site.scholar }}" title="Google Scholar"><img src="{{ '/assets/img/scholar.svg' | relative_url }}" alt="Google Scholar"></a></li>
      <li><a href="https://orcid.org/{{ site.orcid }}" title="ORCID"><img src="{{ '/assets/img/orcid.svg' | relative_url }}" alt="ORCID"></a></li>
    </ul>
  </div>

  <div class="container">
    <ul class="partners-list" aria-label="Affiliations">
    {% for l in site.data.partners %}
      <li><a href="{{ l.url }}" title="{{ l.name }}"><img src="{{ l.img | relative_url }}" alt="{{ l.name }}" style="height: {{ l.height }}px" loading="lazy"></a></li>
    {% endfor %}
    </ul>
  </div>

  <div class="container footer-meta">
    <p>&copy; {{ 'now' | date: '%Y' }} Ishaque Lab. Publication data via <a href="https://openalex.org">OpenAlex</a>.</p>
  </div>
</footer>
