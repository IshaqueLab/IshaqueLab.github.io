<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Ishaque Lab" width="180" height="96">
    </a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.nav %}
        {% assign active = false %}
        {% if item.url == '/' %}
          {% if page.url == '/' %}{% assign active = true %}{% endif %}
        {% elsif page.url contains item.url %}
          {% assign active = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
