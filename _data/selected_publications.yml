# Curated list shown above the live OpenAlex feed on /publications/.
- citation: Sun et al., Nature Methods (2026)
  title: "Beyond benchmarking: an expert-guided consensus approach to spatially aware clustering"
  doi: 10.1038/s41592-026-03194-8
  why: Community benchmark of spatial clustering methods from SpaceHack; introduces SACCELERATOR.

- citation: Tiesmeyer et al., Nature Biotechnology (2026)
  title: Identifying 3D signal overlaps in spatial transcriptomics data with ovrlpy
  doi: 10.1038/s41587-026-03004-8
  why: ovrlpy shows that vertical cell overlap in imaging-based SRT is a pervasive, detectable source of error.

- citation: Müller-Bötticher et al., Genome Biology (2025)
  title: "SpatialLeiden: spatially aware Leiden clustering"
  doi: 10.1186/s13059-025-03489-7
  why: SpatialLeiden and multiSPAETI, spatially-aware clustering and dimensionality reduction that scale to millions of cells.

- citation: Marco Salas et al., Nature Methods (2025)
  title: Optimizing Xenium In Situ data utility by quality assessment and best-practice analysis workflows
  doi: 10.1038/s41592-025-02617-2
  why: Evaluation of the Xenium spatial transcriptomics platform against eight alternative technologies and benchmarks computational tools for data analysis.
  
- citation: Hensel et al., Hypertension (2025)
  title: Memory-like HCV-specific CD8+ T cells retain a molecular scar after cure of chronic HCV infection
  doi: 10.1038/s41590-020-00817-w
  why: HCV cure eliminates terminally exhausted T cells, leaving a persistent exhaustion scar in memory-like subsets.
