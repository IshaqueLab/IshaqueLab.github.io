# One entry per tool. Delete keys you do not have; the template skips empty ones.
# Fields: name, summary, repo (URL), docs (URL), doi (bare DOI), zenodo (URL or DOI URL),
#         pypi (package name), conda (package name), license (short SPDX id, e.g. MIT, BSD-3-Clause)
- group: Tools we lead
  tools:
    - name: SSAM
      summary: Segmentation-free cell-type mapping for imaging-based spatial transcriptomics. Park et al., Nature Communications (2021).
      repo: https://github.com/HiDiHlabs/ssam
      docs: https://ssam.readthedocs.io
      doi: 10.1038/s41467-021-23807-4
      biotools: ssam
      pypi: ssam
      license: AGPL-3.0
    - name: SSAM-lite
      summary: 'Lightweight SSAM implementation that runs in the browser (<a href="https://ssam-lite.netlify.app">ssam-lite.netlify.app</a>). Tiesmeyer et al., Frontiers in Genetics (2022).'
      repo: https://github.com/HiDiHlabs/ssam-lite
      docs: https://ssam-lite.readthedocs.io
      doi: 10.3389/fgene.2022.785877
      biotools: ssam-lite
      license: MIT
    - name: Sainsc
      summary: Segmentation-free spatial analysis at scale for sequencing- and imaging-based spatial transcriptomics. Müller-Bötticher et al., Small Methods (2025).
      repo: https://github.com/HiDiHlabs/sainsc
      docs: https://sainsc.readthedocs.io
      doi: 10.1002/smtd.202401123
      biotools: sainsc
      pypi: sainsc
      bioconda: sainsc
      license: MIT
    - name: SpatialLeiden
      summary: Spatially-aware clustering via multiplex modularity optimisation. Müller-Bötticher et al., Genome Biology (2025).
      repo: https://github.com/HiDiHlabs/SpatialLeiden
      docs: https://spatialleiden.readthedocs.io
      doi: 10.1186/s13059-025-03489-7
      biotools: spatialleiden
      pypi: spatialleiden
      bioconda: spatialleiden
      license: GPL-3.0
    - name: multiSPAETI
      summary: Dimensionality reduction that maximises the product of variance and Moran's I. Müller-Bötticher et al., Genome Biology (2025).
      repo: https://github.com/HiDiHlabs/multiSPAETI
      doi: 10.1186/s13059-025-03489-7
      biotools: multispaeti
      pypi: multispaeti
      bioconda: multispaeti
      license: MIT
    - name: ovrl.py
      summary: Detection of cell overlap and vertical signal integrity in imaging-based SRT. Tiesmeyer et al., Nature Biotechnology (2026).
      repo: https://github.com/HiDiHlabs/ovrl.py
      docs: https://ovrlpy.readthedocs.io
      doi: 10.1038/s41587-026-03004-8
      biotools: ovrlpy
      pypi: ovrlpy
      bioconda: ovrlpy
      license: MIT
    - name: clrmappy
      summary: Automatically colours high-dimensional data using dimensionality reduction.
      repo: https://github.com/HiDiHlabs/clrmappy
      biotools: clrmappy
      license: MIT
    - name: SACCELERATOR
      summary: Framework to run and compare spatial clustering tools. Sun et al., Nature Methods (2026).
      repo: https://github.com/SpatialHackathon/SACCELERATOR
      docs: https://spatialhackathon.github.io/SACCELERATOR/
      doi: 10.1038/s41592-026-03194-8
      biotools: saccelerator
      license: MIT-0

- group: Tools we contribute to
  tools:
    - name: Spatial2Galaxy
      summary: Galaxy platform for reproducible spatial transcriptomics processing (ELIXIR).
      repo: https://workflowhub.eu/workflows/2174
      biotools: spatial2galaxy
      docs: https://galaxyproject.org/bare/eu/usegalaxy/spatialomics/

